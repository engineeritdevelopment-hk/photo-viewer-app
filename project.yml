name: PhotoViewer
options:
  bundleIdPrefix: com.photoviewer
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  PhotoViewer:
    type: application
    platform: macOS
    sources:
      - path: PhotoViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photoviewer.app
        PRODUCT_NAME: Photo Viewer
        CODE_SIGN_ENTITLEMENTS: PhotoViewer/PhotoViewer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_PhotoViewerGitHubRepository: engineeritdevelopment-hk/photo-viewer-app
    dependencies:
      - target: PhotoViewerInstallHelper
        embed: true
    entitlements:
      path: PhotoViewer/PhotoViewer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
  PhotoViewerInstallHelper:
    type: tool
    platform: macOS
    sources:
      - path: PhotoViewerInstallHelper
    settings:
      base:
        PRODUCT_NAME: PhotoViewerInstallHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.photoviewer.install-helper
        SKIP_INSTALL: NO
        ENABLE_HARDENED_RUNTIME: YES
  PhotoViewerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoViewerTests
    dependencies:
      - target: PhotoViewer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.photoviewer.app.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Photo Viewer.app/Contents/MacOS/Photo Viewer"
schemes:
  PhotoViewer:
    build:
      targets:
        PhotoViewer: all
        PhotoViewerTests: [test]
    test:
      targets:
        - PhotoViewerTests
      gatherCoverageData: false